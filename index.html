<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotografiás distintas</title>
    <link
</head>
<body>
    <!-- CABECERA: Contiene logo y menú -->
    <header class="header">
        <div class="logo">TravelNow ✈️</div>
        <nav class="navbar">
            <a href="#inicio">Inicio</a>
            <a href="#destinos">Destinos</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>
    <!-- CONTENIDO PRINCIPAL -->
    <main>
        <!-- SECCIÓN 1: Hero (La portada de impacto) -->
        <section id="inicio" class="hero">
            <div class="hero-content">
                <h1>Descubre el mundo con nosotros</h1>
                <p>Planificamos tu sesion de fotos a tu gusto.</p>
                <button class="btn-primary">Reservar Ahora tu sesion</button>
            </div>
        </section>
        <!-- SECCIÓN 2: Servicios (Uso de Grid) -->
        <section id="destinos" class="servicios">
            <h2>Nuestros Servicios</h2>
            <div class="grid-servicios">
                <article class="card">
                    <img src="img/servicio-1.jpg" alt="Primer plano">
                    <h3>Alta calidad</h3>
                    <p>Dejalo en nuestras manos.</p>
                </article>
                <article class="card">
                    <img src="img/servicio-2.jpg" alt="Segundo plano">
                    <h3>Detalles unicos </h3>
                    <p>Fotos reales y perfectas.</p>
                </article>
                <article class="card">
                    <img src="img/servicio-3.jpg" alt="Tercer plano">
                    <h3>Paquetes Económicos</h3>
                    <p>Accesibles para todo el mundo.</p>
                </article>
            </div>
        </section>
    </main>
    
</body>
</html>>
